name: Orbiq Diagnose Local Supabase

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Setup pnpm and Node.js
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          version: 11.22.0
          runtime: node@22.23.2
          cache: true
          install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Supabase start with diagnostics
        shell: bash
        run: |
          set +e
          pnpm exec supabase start --debug 2>&1 | tee /tmp/supabase-start.log
          status=${PIPESTATUS[0]}
          echo "SUPABASE_START_STATUS=$status"
          echo "--- docker ps ---"
          docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}'
          echo "--- supabase status ---"
          pnpm exec supabase status --debug 2>&1 || true
          echo "--- postgres container logs ---"
          docker logs supabase_db_orbiq-platform 2>&1 | tail -300 || true
          echo "--- start log tail ---"
          tail -300 /tmp/supabase-start.log || true
          exit "$status"
