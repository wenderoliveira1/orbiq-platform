name: Orbiq Quality Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

concurrency:
  group: orbiq-quality-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          version: 11.22.0
          runtime: node@22.23.2
          cache: true
          install: false

      - name: Verify toolchain contract
        shell: bash
        run: |
          test "$(node --version)" = "v22.23.2"
          test "$(pnpm --version)" = "11.22.0"

      - name: Verify repository toolchain consistency
        run: node scripts/verify-toolchain-consistency.mjs

      - name: Verify immutable CI actions
        run: node scripts/verify-ci-action-pins.mjs

      - name: Verify CI resource bounds
        run: node scripts/verify-ci-resource-bounds.mjs

      - name: Verify CI trigger contract
        run: node scripts/verify-ci-trigger-contract.mjs

      - name: Verify AutoQA artifact privacy
        run: node scripts/verify-autoqa-artifact-privacy.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Supabase CLI contract
        shell: bash
        run: test "$(pnpm exec supabase --version)" = "2.115.0"

      - name: Orbiq Quality Gate
        run: node scripts/quality-gate.mjs
