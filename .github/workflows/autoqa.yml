name: Orbiq AutoQA

on:
  push:
    branches:
      - "qa/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orbiq-autoqa-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  autoqa:
    name: AutoQA / Chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          version: 11.22.0
          runtime: node@22
          cache: true
          install: false

      - name: Install project dependencies
        run: pnpm install --frozen-lockfile

      - name: Technical Quality Gate
        run: node scripts/quality-gate.mjs

      - name: Install Playwright test runner
        run: pnpm add -Dw @playwright/test@1.55.0

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Export isolated Supabase environment
        shell: bash
        run: |
          eval "$(pnpm exec supabase status -o env)"

          PUBLIC_KEY="${PUBLISHABLE_KEY:-${ANON_KEY:-}}"
          APP_URL="http://127.0.0.1:3000"

          if [ -z "${API_URL:-}" ]; then
            echo "Supabase API_URL not found"
            exit 1
          fi

          if [ -z "$PUBLIC_KEY" ]; then
            echo "Supabase publishable/anon key not found"
            exit 1
          fi

          {
            echo "NEXT_PUBLIC_APP_URL=$APP_URL"
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLIC_KEY"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$PUBLIC_KEY"
            echo "AUTOQA_SUPABASE_URL=$API_URL"
            echo "AUTOQA_SUPABASE_PUBLIC_KEY=$PUBLIC_KEY"
            echo "AUTOQA_POSTGRES_CONTAINER=supabase_db_orbiq-platform"
            echo "AUTOQA_BASE_URL=$APP_URL"
          } >> "$GITHUB_ENV"

      - name: Run Orbiq AutoQA
        run: pnpm exec playwright test

      - name: Upload AutoQA report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: orbiq-autoqa-report-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            playwright-report
            test-results
